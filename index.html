
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Website title -->
    <title>Nexfinity Store</title>

    <!-- SEO description -->
    <meta
      name="description"
      content="Nexfinity Store helps businesses create beautiful online stores, showcase products, manage orders and grow their businesses with ease."
    />

    <meta
      name="keywords"
      content="Nexfinity Store, online store, ecommerce Nigeria, WhatsApp store, business website, online shopping"
    />

    <meta name="author" content="Nexfinity" />

    <!-- Browser theme -->
    <meta name="theme-color" content="#10120D" />

    <meta name="color-scheme" content="light" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/images/favicon.png"
    />

    <!-- Apple touch icon -->
    <link
      rel="apple-touch-icon"
      href="/images/logo.png"
    />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Nexfinity Store"
    />

    <meta
      property="og:description"
      content="Create your online store, showcase your products, receive orders and grow your business with Nexfinity Store."
    />

    <meta
      property="og:image"
      content="/images/logo.png"
    />

    <meta
      property="og:site_name"
      content="Nexfinity Store"
    />

    <!-- Twitter sharing -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Nexfinity Store"
    />

    <meta
      name="twitter:description"
      content="Your store. Your brand. Your growth."
    />

    <meta
      name="twitter:image"
      content="/images/logo.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
